[project]
name = "pixora-service"
version = "0.1.0"
description = "Pixora local service: scanning, thumbnails, and the typed API the UI talks to."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "rawpy>=0.24",
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python>=4.10",
    "onnxruntime-directml>=1.20",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

# Model test scripts in phase0/ (see docs/PHASE0.md).
phase0 = [
    "scikit-learn>=1.5",
    "huggingface_hub>=0.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pixora_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
